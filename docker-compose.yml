services:
  db:
    image: postgres:18-alpine
    container_name: hrms-db
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hrms?sslmode=disable
      APP_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "/app/migrate && /app/server"

volumes:
  postgres_data:

